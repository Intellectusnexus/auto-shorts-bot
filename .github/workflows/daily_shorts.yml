name: Auto YouTube Shorts Bot

on:
  push:
    branches:
      - main 
  schedule:
    - cron: '15 5 * * *'  
    - cron: '15 14 * * *' 
  workflow_dispatch: 

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12 & Enable Caching
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # This single line prevents re-downloading dependencies every run

    - name: Install FFmpeg with full codecs
      run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-extra

    - name: Install Python Dependencies
      run: pip install -r requirements.txt

    - name: Run Auto Shorts Script
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: python main.py
      
