name: Auto YouTube Shorts Bot

on:
  push:
    branches:
      - main 
  schedule:
    # Runs twice a day automatically on GitHub's cloud servers
    - cron: '15 5 * * *'  # Morning run
    - cron: '15 14 * * *' # Evening run
  workflow_dispatch: 

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install FFmpeg with full codecs
      run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-extra

    - name: Install Python Dependencies
      run: pip install -r requirements.txt

    - name: Run Auto Shorts Script
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: python main.py
      
