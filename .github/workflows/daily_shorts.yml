name: Auto YouTube Shorts Bot

on:
  push:
    branches:
      - main # (Change to 'master' if your default branch is named master)
  schedule:
    # Offset by 15 minutes to bypass GitHub's top-of-the-hour bottlenecks
    - cron: '15 5 * * *'  # Runs at 10:45 AM IST
    - cron: '15 14 * * *' # Runs at 7:45 PM IST
  workflow_dispatch: 

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: pip install -r requirements.txt

    - name: Run Auto Shorts Script
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: python main.py
      
